<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolTechLabs</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#fff;
    color:#000;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:14px;
}

/* ===== LAYOUT ===== */
.wrapper{
    max-width:900px;
    width:100%;
}

/* ===== BRAND ===== */
h1{
    font-size:clamp(30px,7vw,60px);
    font-weight:700;
    margin-bottom:6px;
}

/* ===== TAGLINE ===== */
.tagline{
    font-size:clamp(13px,3.5vw,20px);
    font-weight:600;
    letter-spacing:3px;
    margin-bottom:22px;
    opacity:.85;
}

/* ===== GRAPHIC ===== */
.hero-graphic{
    width:100%;
    max-width:820px;
    margin:0 auto 26px;
}

.hero-graphic img{
    width:100%;
    height:auto;
    display:block;
}

/* ===== INTRO ===== */
p{
    font-size:clamp(14px,3.5vw,16px);
    line-height:1.6;
    margin-bottom:20px;
    max-width:720px;
    margin-inline:auto;
    opacity:.95;
}

/* ===== COMING SOON ===== */
.coming-soon{
    display:inline-flex;
    align-items:center;
    padding:8px 18px;
    background:#000;
    color:#fff;
    font-size:11px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    border-radius:2px;
    gap:6px;
}

.dots span{
    opacity:0;
    animation:dot 1.4s infinite;
}

.dots span:nth-child(1){animation-delay:0s;}
.dots span:nth-child(2){animation-delay:.3s;}
.dots span:nth-child(3){animation-delay:.6s;}

@keyframes dot{
    0%{opacity:0}
    20%{opacity:1}
    100%{opacity:0}
}
</style>
</head>

<body>

<div class="wrapper">

    <h1>SolTechLabs</h1>
    <div class="tagline">SOLUTION BY R&amp;D</div>

    <!-- GRAPHIC IMAGE -->
    <div class="hero-graphic">
        <img src="images/research-evolution.png" alt="Idea to Final Solution Evolution Graphic">
    </div>

    <p>
        SolTechLabs is a research-driven tech solution consultancy and development organization.
        We focus on transforming ideas into validated, structured, and production-ready solutions
        through deep research and development.
    </p>

    <div class="coming-soon">
        Coming Soon
        <span class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </span>
    </div>

</div>

</body>
</html>
