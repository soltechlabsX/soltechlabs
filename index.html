<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolTechLabs</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#fff;
    color:#000;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:14px;
    overflow:hidden;
}

/* ===== LAYOUT ===== */
.wrapper{
    max-width:820px;
    width:100%;
}

/* ===== BRAND ===== */
h1{
    font-size:clamp(30px,7vw,60px);
    font-weight:700;
    margin-bottom:6px;
    transition:transform .25s ease,letter-spacing .25s ease;
}

h1:hover,
h1:active{
    transform:translateY(-4px);
    letter-spacing:2px;
}

/* ===== TAGLINE ===== */
.tagline{
    font-size:clamp(13px,3.5vw,20px);
    font-weight:600;
    letter-spacing:3px;
    margin-bottom:12px;
    opacity:.8;
    transition:transform .25s ease,opacity .25s ease;
}

.tagline:hover,
.tagline:active{
    transform:translateY(-3px);
    opacity:1;
}

/* ===== INTRO ===== */
p{
    font-size:clamp(14px,3.5vw,16px);
    line-height:1.5;
    margin-bottom:16px;
    max-width:720px;
    margin-inline:auto;
    opacity:.95;
    transition:transform .25s ease;
}

p:hover,
p:active{
    transform:translateY(-2px);
}

/* ===== COMING SOON (DARK + DOTS) ===== */
.coming-soon{
    display:inline-flex;
    align-items:center;
    padding:8px 18px;
    background:#000;
    color:#fff;
    font-size:11px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    border-radius:2px;
    gap:6px;
    transition:transform .25s ease;
}

.coming-soon:hover,
.coming-soon:active{
    transform:translateY(-3px) scale(1.03);
}

/* DOT SEQUENCE */
.dots span{
    opacity:0;
    animation:dot 1.4s infinite;
}

.dots span:nth-child(1){animation-delay:0s;}
.dots span:nth-child(2){animation-delay:.3s;}
.dots span:nth-child(3){animation-delay:.6s;}

@keyframes dot{
    0%{opacity:0}
    20%{opacity:1}
    100%{opacity:0}
}

/* REMOVE TAP HIGHLIGHT */
@media (hover:none){
    *{
        -webkit-tap-highlight-color:transparent;
    }
}
</style>
</head>

<body>

<div class="wrapper">
    <h1>SolTechLabs</h1>

    <div class="tagline">SOLUTION BY R&amp;D</div>

    <p>
  SolTechLabs Is A Research-Driven Tech Solution Consultancy And Development Organization. We Focus On Finding And Building Valuable Tech Solutions By Research And Development.


    <div class="coming-soon">
        Coming Soon
        <span class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </span>
    </div>
</div>

</body>
</html>
